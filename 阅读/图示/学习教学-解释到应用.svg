<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1060" viewBox="0 0 1800 1060"><rect width="1800" height="1060" fill="#fffdf8"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#355866" stroke-width="1.5"/></marker></defs><text x="45" y="61" font-family="Microsoft YaHei, sans-serif" font-size="36" fill="#243c48"><tspan x="45" dy="0">从“看懂了”到“能解释、能使用”</tspan></text><text x="45" y="109" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#243c48"><tspan x="45" dy="0">一次只处理一个问题。留下缺口，是下一步有了方向。</tspan></text><rect x="40" y="170" width="360" height="245" rx="22" fill="#e8f3fa" stroke="#355866" stroke-width="2"/><ellipse cx="84.0" cy="212.0" rx="22.0" ry="22.0" fill="#ffe0b5" stroke="#355866" stroke-width="2"/><ellipse cx="74.5" cy="206.5" rx="1.5" ry="1.5" fill="#355866" stroke="#355866" stroke-width="2"/><ellipse cx="92.5" cy="206.5" rx="1.5" ry="1.5" fill="#355866" stroke="#355866" stroke-width="2"/><polyline points="77,219 88,219" fill="none" stroke="#355866" stroke-width="3"/><polyline points="84,234 84,255 68,267" fill="none" stroke="#355866" stroke-width="3"/><polyline points="84,255 100,267" fill="none" stroke="#355866" stroke-width="3"/><text x="122" y="225" font-family="Microsoft YaHei, sans-serif" font-size="25" fill="#243c48"><tspan x="122" dy="0">1 选一个小问题</tspan></text><text x="62" y="317" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#243c48"><tspan x="62" dy="0">为什么这次用80作分母？</tspan><tspan x="62" dy="33.0">先说用途与要检验的任务。</tspan></text><rect x="480" y="170" width="360" height="245" rx="22" fill="#e8f3fa" stroke="#355866" stroke-width="2"/><ellipse cx="524.0" cy="212.0" rx="22.0" ry="22.0" fill="#ffe0b5" stroke="#355866" stroke-width="2"/><ellipse cx="514.5" cy="206.5" rx="1.5" ry="1.5" fill="#355866" stroke="#355866" stroke-width="2"/><ellipse cx="532.5" cy="206.5" rx="1.5" ry="1.5" fill="#355866" stroke="#355866" stroke-width="2"/><polyline points="517,219 528,219" fill="none" stroke="#355866" stroke-width="3"/><polyline points="524,234 524,255 508,267" fill="none" stroke="#355866" stroke-width="3"/><polyline points="524,255 540,267" fill="none" stroke="#355866" stroke-width="3"/><text x="562" y="225" font-family="Microsoft YaHei, sans-serif" font-size="25" fill="#243c48"><tspan x="562" dy="0">2 看材料与示范</tspan></text><text x="502" y="317" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#243c48"><tspan x="502" dy="0">找理由、条件和例子。</tspan><tspan x="502" dy="33.0">陌生时允许看着材料学。</tspan></text><rect x="920" y="170" width="360" height="245" rx="22" fill="#fff0ca" stroke="#355866" stroke-width="2"/><ellipse cx="964.0" cy="212.0" rx="22.0" ry="22.0" fill="#ffe0b5" stroke="#355866" stroke-width="2"/><ellipse cx="954.5" cy="206.5" rx="1.5" ry="1.5" fill="#355866" stroke="#355866" stroke-width="2"/><ellipse cx="972.5" cy="206.5" rx="1.5" ry="1.5" fill="#355866" stroke="#355866" stroke-width="2"/><polyline points="957,219 968,219" fill="none" stroke="#355866" stroke-width="3"/><polyline points="964,234 964,255 948,267" fill="none" stroke="#355866" stroke-width="3"/><polyline points="964,255 980,267" fill="none" stroke="#355866" stroke-width="3"/><text x="1002" y="225" font-family="Microsoft YaHei, sans-serif" font-size="25" fill="#243c48"><tspan x="1002" dy="0">3 用自己的话讲</tspan></text><text x="942" y="317" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#243c48"><tspan x="942" dy="0">暂放下材料，说为什么。</tspan><tspan x="942" dy="33.0">不完整也先保留原答。</tspan></text><rect x="1360" y="170" width="360" height="245" rx="22" fill="#fff0ca" stroke="#355866" stroke-width="2"/><ellipse cx="1404.0" cy="212.0" rx="22.0" ry="22.0" fill="#ffe0b5" stroke="#355866" stroke-width="2"/><ellipse cx="1394.5" cy="206.5" rx="1.5" ry="1.5" fill="#355866" stroke="#355866" stroke-width="2"/><ellipse cx="1412.5" cy="206.5" rx="1.5" ry="1.5" fill="#355866" stroke="#355866" stroke-width="2"/><polyline points="1397,219 1408,219" fill="none" stroke="#355866" stroke-width="3"/><polyline points="1404,234 1404,255 1388,267" fill="none" stroke="#355866" stroke-width="3"/><polyline points="1404,255 1420,267" fill="none" stroke="#355866" stroke-width="3"/><text x="1442" y="225" font-family="Microsoft YaHei, sans-serif" font-size="25" fill="#243c48"><tspan x="1442" dy="0">4 对照来源检查</tspan></text><text x="1382" y="317" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#243c48"><tspan x="1382" dy="0">标出遗漏、错误与条件。</tspan><tspan x="1382" dy="33.0">流畅、点头不等于正确。</tspan></text><rect x="1360" y="590" width="360" height="245" rx="22" fill="#fce8df" stroke="#355866" stroke-width="2"/><ellipse cx="1404.0" cy="632.0" rx="22.0" ry="22.0" fill="#ffe0b5" stroke="#355866" stroke-width="2"/><ellipse cx="1394.5" cy="626.5" rx="1.5" ry="1.5" fill="#355866" stroke="#355866" stroke-width="2"/><ellipse cx="1412.5" cy="626.5" rx="1.5" ry="1.5" fill="#355866" stroke="#355866" stroke-width="2"/><polyline points="1397,639 1408,639" fill="none" stroke="#355866" stroke-width="3"/><polyline points="1404,654 1404,675 1388,687" fill="none" stroke="#355866" stroke-width="3"/><polyline points="1404,675 1420,687" fill="none" stroke="#355866" stroke-width="3"/><text x="1442" y="645" font-family="Microsoft YaHei, sans-serif" font-size="25" fill="#243c48"><tspan x="1442" dy="0">5 定点补一个缺口</tspan></text><text x="1382" y="737" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#243c48"><tspan x="1382" dy="0">想不起：补线索再撤去。</tspan><tspan x="1382" dy="33.0">不理解：看正反例与理由。</tspan></text><rect x="920" y="590" width="360" height="245" rx="22" fill="#fce8df" stroke="#355866" stroke-width="2"/><ellipse cx="964.0" cy="632.0" rx="22.0" ry="22.0" fill="#ffe0b5" stroke="#355866" stroke-width="2"/><ellipse cx="954.5" cy="626.5" rx="1.5" ry="1.5" fill="#355866" stroke="#355866" stroke-width="2"/><ellipse cx="972.5" cy="626.5" rx="1.5" ry="1.5" fill="#355866" stroke="#355866" stroke-width="2"/><polyline points="957,639 968,639" fill="none" stroke="#355866" stroke-width="3"/><polyline points="964,654 964,675 948,687" fill="none" stroke="#355866" stroke-width="3"/><polyline points="964,675 980,687" fill="none" stroke="#355866" stroke-width="3"/><text x="1002" y="645" font-family="Microsoft YaHei, sans-serif" font-size="25" fill="#243c48"><tspan x="1002" dy="0">6 修正后重新解释</tspan></text><text x="942" y="737" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#243c48"><tspan x="942" dy="0">留原答，添修正与出处。</tspan><tspan x="942" dy="33.0">能讲清后，准备换题。</tspan></text><rect x="480" y="590" width="360" height="245" rx="22" fill="#e7f2dd" stroke="#355866" stroke-width="2"/><ellipse cx="524.0" cy="632.0" rx="22.0" ry="22.0" fill="#ffe0b5" stroke="#355866" stroke-width="2"/><ellipse cx="514.5" cy="626.5" rx="1.5" ry="1.5" fill="#355866" stroke="#355866" stroke-width="2"/><ellipse cx="532.5" cy="626.5" rx="1.5" ry="1.5" fill="#355866" stroke="#355866" stroke-width="2"/><polyline points="517,639 528,639" fill="none" stroke="#355866" stroke-width="3"/><polyline points="524,654 524,675 508,687" fill="none" stroke="#355866" stroke-width="3"/><polyline points="524,675 540,687" fill="none" stroke="#355866" stroke-width="3"/><text x="562" y="645" font-family="Microsoft YaHei, sans-serif" font-size="25" fill="#243c48"><tspan x="562" dy="0">7 换题或实际操作</tspan></text><text x="502" y="737" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#243c48"><tspan x="502" dy="0">CP1：解释＋应用＋条件。</tspan><tspan x="502" dy="33.0">需要提示就记录帮助。</tspan></text><rect x="40" y="590" width="360" height="245" rx="22" fill="#e7f2dd" stroke="#355866" stroke-width="2"/><ellipse cx="84.0" cy="632.0" rx="22.0" ry="22.0" fill="#ffe0b5" stroke="#355866" stroke-width="2"/><ellipse cx="74.5" cy="626.5" rx="1.5" ry="1.5" fill="#355866" stroke="#355866" stroke-width="2"/><ellipse cx="92.5" cy="626.5" rx="1.5" ry="1.5" fill="#355866" stroke="#355866" stroke-width="2"/><polyline points="77,639 88,639" fill="none" stroke="#355866" stroke-width="3"/><polyline points="84,654 84,675 68,687" fill="none" stroke="#355866" stroke-width="3"/><polyline points="84,675 100,687" fill="none" stroke="#355866" stroke-width="3"/><text x="122" y="645" font-family="Microsoft YaHei, sans-serif" font-size="25" fill="#243c48"><tspan x="122" dy="0">8 接回主题与专案</tspan></text><text x="62" y="737" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#243c48"><tspan x="62" dy="0">地址＋关系 → CP2串联。</tspan><tspan x="62" dy="33.0">再做CP3大测、CP4隔时检验。</tspan></text><polyline points="400,292 480,292" fill="none" stroke="#355866" stroke-width="3" marker-end="url(#a)"/><text x="403" y="269" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#243c48"><tspan x="403" dy="0">找依据</tspan></text><polyline points="840,292 920,292" fill="none" stroke="#355866" stroke-width="3" marker-end="url(#a)"/><text x="843" y="269" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#243c48"><tspan x="843" dy="0">试解释</tspan></text><polyline points="1280,292 1360,292" fill="none" stroke="#355866" stroke-width="3" marker-end="url(#a)"/><text x="1283" y="269" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#243c48"><tspan x="1283" dy="0">查准确</tspan></text><polyline points="1540,415 1540,590" fill="none" stroke="#355866" stroke-width="3" marker-end="url(#a)"/><text x="1558" y="501" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#243c48"><tspan x="1558" dy="0">有缺口</tspan><tspan x="1558" dy="31.5">才补读</tspan></text><polyline points="1360,710 1280,710" fill="none" stroke="#355866" stroke-width="3" marker-end="url(#a)"/><text x="1280" y="684" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#243c48"><tspan x="1280" dy="0">再解释</tspan></text><polyline points="920,710 840,710" fill="none" stroke="#355866" stroke-width="3" marker-end="url(#a)"/><text x="840" y="684" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#243c48"><tspan x="840" dy="0">能讲清</tspan></text><polyline points="480,710 400,710" fill="none" stroke="#355866" stroke-width="3" marker-end="url(#a)"/><text x="400" y="684" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#243c48"><tspan x="400" dy="0">暂通过</tspan></text><polyline points="1360,380 1320,380 1320,470 660,470 660,590" fill="none" stroke="#355866" stroke-width="3" marker-end="url(#a)"/><text x="960" y="521" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#243c48"><tspan x="960" dy="0">核对无缺口 → 直接换题检查</tspan></text><polyline points="1540,835 1540,895 900,895 900,450 660,450 660,415" fill="none" stroke="#355866" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#a)"/><text x="800" y="932" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#243c48"><tspan x="800" dy="0">补读仍不清 → 返回材料、换示范或求助</tspan></text><polyline points="480,805 445,805 445,990 1730,990 1730,835" fill="none" stroke="#355866" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#a)"/><text x="720" y="1021" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#243c48"><tspan x="720" dy="0">应用失败 → 定位出错的一步，补练后再试</tspan></text><text x="45" y="481" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#243c48"><tspan x="45" dy="0">读图：实线＝推进／条件分支</tspan><tspan x="45" dy="31.5">虚线＝带证据回查与修正</tspan><tspan x="45" dy="31.5">整理者设计；不是学会的证明</tspan></text></svg>