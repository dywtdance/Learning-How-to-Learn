<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1460" viewBox="0 0 2200 1460"><title>心流与学习：从理解到投入，再到检验和复用</title><defs><marker id="head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="2200" height="1460" fill="#f8fafc"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="60" y="78.2" fill="#0f172a" font-size="42"><tspan x="60" dy="0">心流与学习：从理解到投入，再到检验和复用</tspan></text><text x="60" y="127.5" fill="#334155" font-size="25"><tspan x="60" dy="0">主问题：怎样把值得学的内容，变成能持续投入、能够检验和复用的能力？</tspan></text><rect x="40" y="520" width="2110" height="175" rx="18" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.8"/><text x="75" y="588.3" fill="#9a3412" font-size="33"><tspan x="75" dy="0">目的与内容</tspan></text><polyline points="75,605 240,605" fill="none" stroke="#9a3412" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="475" y="588.3" fill="#9a3412" font-size="33"><tspan x="475" dy="0">组织与练习</tspan></text><polyline points="475,605 640,605" fill="none" stroke="#9a3412" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="915" y="588.3" fill="#9a3412" font-size="33"><tspan x="915" dy="0">当前任务</tspan></text><polyline points="915,605 1047,605" fill="none" stroke="#9a3412" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="1335" y="588.3" fill="#9a3412" font-size="33"><tspan x="1335" dy="0">结果核验</tspan></text><polyline points="1335,605 1467,605" fill="none" stroke="#9a3412" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="1810" y="588.3" fill="#9a3412" font-size="33"><tspan x="1810" dy="0">保持与迁移</tspan></text><polyline points="1810,605 1975,605" fill="none" stroke="#9a3412" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="75" y="648.1" fill="#334155" font-size="21"><tspan x="75" dy="0">为什么／学什么／怎样验收</tspan></text><text x="475" y="648.1" fill="#334155" font-size="21"><tspan x="475" dy="0">理解关系＋练出动作</tspan></text><text x="915" y="648.1" fill="#334155" font-size="21"><tspan x="915" dy="0">解释、操作，留下结果</tspan></text><text x="1335" y="648.1" fill="#334155" font-size="21"><tspan x="1335" dy="0">准确？独立完成？代价？</tspan></text><text x="1810" y="648.1" fill="#334155" font-size="21"><tspan x="1810" dy="0">隔时可用／换情境检验</tspan></text><polyline points="290,586 455,586" fill="none" stroke="#c2410c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><text x="300" y="565.1" fill="#c2410c" font-size="21"><tspan x="300" dy="0">决定取舍</tspan></text><polyline points="700,586 895,586" fill="none" stroke="#c2410c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><text x="710" y="565.1" fill="#c2410c" font-size="21"><tspan x="710" dy="0">用于行动</tspan></text><polyline points="1130,586 1315,586" fill="none" stroke="#c2410c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><text x="1140" y="565.1" fill="#c2410c" font-size="21"><tspan x="1140" dy="0">检验产出</tspan></text><polyline points="1550,586 1790,586" fill="none" stroke="#c2410c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><text x="1560" y="565.1" fill="#c2410c" font-size="21"><tspan x="1560" dy="0">通过后再检查</tspan></text><text x="65" y="241.3" fill="#1d4ed8" font-size="33"><tspan x="65" dy="0">材料</tspan></text><polyline points="65,258 131,258" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="65" y="295.3" fill="#334155" font-size="23"><tspan x="65" dy="0">事实、例子、概念</tspan><tspan x="65" dy="34.5">记忆提供可操作内容</tspan></text><text x="460" y="241.3" fill="#1d4ed8" font-size="33"><tspan x="460" dy="0">关系与规则</tspan></text><polyline points="460,258 625,258" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="460" y="295.3" fill="#334155" font-size="23"><tspan x="460" dy="0">组块、比较、条件、反例</tspan><tspan x="460" dy="34.5">说明为什么这样连接</tspan></text><text x="965" y="241.3" fill="#1d4ed8" font-size="33"><tspan x="965" dy="0">自己的解释</tspan></text><polyline points="965,258 1130,258" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="965" y="295.3" fill="#334155" font-size="23"><tspan x="965" dy="0">写出来／讲清楚</tspan><tspan x="965" dy="34.5">暴露模糊与冲突</tspan></text><polyline points="210,240 430,240" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><text x="290" y="218.1" fill="#2563eb" font-size="21"><tspan x="290" dy="0">组织</tspan></text><polyline points="710,240 935,240" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><text x="790" y="218.1" fill="#2563eb" font-size="21"><tspan x="790" dy="0">表达</tspan></text><polyline points="600,350 600,500" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><text x="625" y="438.1" fill="#2563eb" font-size="21"><tspan x="625" dy="0">结构用于选择方法</tspan></text><polyline points="1065,350 1065,410 770,410 770,350" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)" stroke-dasharray="9 7"/><text x="785" y="388.1" fill="#2563eb" font-size="21"><tspan x="785" dy="0">发现缺口 → 回查关系</tspan></text><text x="65" y="444.2" fill="#475569" font-size="22"><tspan x="65" dy="0">F6：记忆→组织→符号运用；I10：解释接受核对</tspan><tspan x="65" dy="33.0">接既有卡片笔记：有意义的连接，而非堆积词语</tspan></text><text x="1570" y="241.3" fill="#7c3aed" font-size="33"><tspan x="1570" dy="0">可复用的理解</tspan></text><polyline points="1570,258 1768,258" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="1570" y="296.4" fill="#334155" font-size="24"><tspan x="1570" dy="0">记下来源、理由、条件与反例</tspan><tspan x="1570" dy="36.0">在新问题中调用，再修正</tspan></text><polyline points="2100,520 2100,365" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)" stroke-dasharray="9 7"/><text x="1640" y="413.1" fill="#7c3aed" font-size="21"><tspan x="1640" dy="0">新情境提供修正依据</tspan></text><polyline points="1570,260 1410,260 1410,155 600,155 600,190" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)" stroke-dasharray="9 7"/><text x="925" y="176.1" fill="#7c3aed" font-size="21"><tspan x="925" dy="0">为下一次理解提供起点</tspan></text><text x="1570" y="468.1" fill="#7c3aed" font-size="21"><tspan x="1570" dy="0">学习复利来自检验和复用，不是笔记数量</tspan></text><text x="470" y="826.3" fill="#047857" font-size="33"><tspan x="470" dy="0">活动条件</tspan></text><polyline points="470,843 602,843" fill="none" stroke="#047857" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="65" y="961.3" fill="#047857" font-size="33"><tspan x="65" dy="0">当前目标</tspan></text><polyline points="65,978 197,978" fill="none" stroke="#047857" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="65" y="1020.3" fill="#334155" font-size="23"><tspan x="65" dy="0">此刻做什么？</tspan><tspan x="65" dy="34.5">不只想远期成绩</tspan></text><text x="440" y="961.3" fill="#047857" font-size="33"><tspan x="440" dy="0">可用反馈</tspan></text><polyline points="440,978 572,978" fill="none" stroke="#047857" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="440" y="1020.3" fill="#334155" font-size="23"><tspan x="440" dy="0">看哪些信息来改？</tspan><tspan x="440" dy="34.5">足够具体，避免淹没</tspan></text><text x="820" y="961.3" fill="#047857" font-size="33"><tspan x="820" dy="0">挑战与技巧</tspan></text><polyline points="820,978 985,978" fill="none" stroke="#047857" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="820" y="1020.3" fill="#334155" font-size="23"><tspan x="820" dy="0">无聊／过难／缺支持？</tspan><tspan x="820" dy="34.5">随能力与任务调整</tspan></text><polyline points="630,790 630,735 1020,735 1020,695" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><text x="700" y="771.1" fill="#059669" font-size="21"><tspan x="700" dy="0">支持行动与投入；不保证心流</tspan></text><polyline points="620,858 620,890 180,890 180,915" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="620,858 620,890 555,890 555,915" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="620,858 620,890 950,890 950,915" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="65" y="1136.4" fill="#047857" font-size="24"><tspan x="65" dy="0">贯穿条件：可用时间、选择空间、资源、干扰、支持与恢复。</tspan><tspan x="65" dy="36.0">困难时先辨别缺口；允许缩小任务、求助、改变环境或调整目标。</tspan></text><text x="1380" y="821.3" fill="#9f1239" font-size="33"><tspan x="1380" dy="0">两种信息分别检查</tspan></text><polyline points="1380,838 1644,838" fill="none" stroke="#9f1239" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="1380" y="887.5" fill="#334155" font-size="25"><tspan x="1380" dy="0">成果：准确、独立、延迟可用、迁移</tspan><tspan x="1380" dy="37.5">体验：是否投入；疲惫与生活代价</tspan></text><text x="1380" y="981.4" fill="#9f1239" font-size="24"><tspan x="1380" dy="0">流畅 ≠ 正确；控制感 ≠ 实际控制</tspan><tspan x="1380" dy="36.0">没有心流，也可以完成有效练习</tspan></text><polyline points="1450,695 1450,770" fill="none" stroke="#9f1239" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><polyline points="1380,905 1190,905 1190,1045 1060,1045" fill="none" stroke="#9f1239" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)" stroke-dasharray="9 7"/><text x="1195" y="1093.1" fill="#9f1239" font-size="21"><tspan x="1195" dy="0">卡点反馈 → 调整条件</tspan></text><polyline points="1665,1030 1665,1210 25,1210 25,715 340,715 340,695" fill="none" stroke="#9f1239" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)" stroke-dasharray="9 7"/><text x="620" y="1250.3" fill="#9f1239" font-size="23"><tspan x="620" dy="0">结果不成立 → 补知识、练动作、改任务；必要时重选目标</tspan></text><rect x="45" y="1300" width="2110" height="120" rx="18" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.8"/><text x="65" y="1339.2" fill="#334155" font-size="22"><tspan x="65" dy="0">I22 旁注：准备／挣扎 → 释放 → 心流 → 恢复。作者的周期模型，不是人人必经步骤，也不同于 F4 的挑战—技巧发展图。</tspan></text><text x="65" y="1383.1" fill="#475569" font-size="21"><tspan x="65" dy="0">来源：F＝《心流》3、4、6、9章；I＝《不可能的艺术》9、10、19—23章。实线：功能关系；虚线：反馈／跨书综合。</tspan></text></g></svg>