<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><rect width="1200" height="1120" fill="#f8fafc"/><text x="44" y="62.0" font-family="Microsoft YaHei, sans-serif" font-size="34" fill="#0f172a">超速学习 · 把学习变成可检验的过程</text><text x="44" y="105.0" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#64748b">学习方法类  /  14 章 · 九条法则 · 以实际能力检验学习</text><rect x="44" y="134" width="1112" height="58" rx="16" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1.5"/><text x="64" y="169.0" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#075985">贯穿全过程：专心致志｜匹配时间、精力与任务；高强度不等于超长时间</text><rect x="44" y="230" width="344" height="176" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="62" y="270.0" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#0f172a">01  画学习地图</text><text x="62" y="311.0" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#334155">为何学？要能做什么？</text><text x="62" y="339.5" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#334155">概念、事实、程序分别是什么？</text><text x="62" y="368.0" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#334155">先选资源与验收任务。</text><rect x="428" y="230" width="344" height="176" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="446" y="270.0" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#0f172a">02  做一次直接练习</text><text x="446" y="311.0" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#334155">让任务接近实际用途。</text><text x="446" y="339.5" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#334155">主动回想、解释或操作，</text><text x="446" y="368.0" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#334155">留下可检查的结果。</text><rect x="812" y="230" width="344" height="176" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="830" y="270.0" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#0f172a">03  看具体反馈</text><text x="830" y="311.0" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#334155">整体结果 → 错误位置</text><text x="830" y="339.5" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#334155">→ 可行修法。</text><text x="830" y="368.0" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#334155">区分信号与噪音。</text><rect x="812" y="462" width="344" height="176" rx="16" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5"/><text x="830" y="502.0" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#0f172a">04  对瓶颈作专项操练</text><text x="830" y="543.0" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#334155">提出瓶颈假设，隔离练习。</text><text x="830" y="571.5" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#334155">降低无关负担，</text><text x="830" y="600.0" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#334155">集中改善一个环节。</text><rect x="428" y="462" width="344" height="176" rx="16" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5"/><text x="446" y="502.0" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#0f172a">05  回到完整任务</text><text x="446" y="543.0" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#334155">子技能改善后，整体也好吗？</text><text x="446" y="571.5" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#334155">用新任务检查迁移。</text><text x="446" y="600.0" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#334155">不见改善就修正假设。</text><rect x="44" y="462" width="344" height="176" rx="16" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5"/><text x="62" y="502.0" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#0f172a">06  复盘并选下一步</text><text x="62" y="543.0" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#334155">保留有效方法，调整失配。</text><text x="62" y="571.5" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#334155">维持核心能力、以后重学，</text><text x="62" y="600.0" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#334155">或选择下一项深入目标。</text><polyline points="388,316 426,316" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><polyline points="772,316 810,316" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><polyline points="984,406 984,460" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><polyline points="812,550 774,550" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><polyline points="428,550 390,550" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><text x="44" y="693.0" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#0f172a">持续加固学习：先尝试，再核对；隔一段时间，还能不能用？</text><rect x="44" y="724" width="344" height="135" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/><text x="62" y="763.0" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#9a3412">保留记忆 · 第 10 章</text><text x="62" y="803.0" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#334155">间隔练习与关键技能使用</text><text x="62" y="831.5" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#334155">按价值选择保持或重学</text><rect x="428" y="724" width="344" height="135" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/><text x="446" y="763.0" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#9a3412">培养直觉 · 第 11 章</text><text x="446" y="803.0" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#334155">解释理由、推导、举例</text><text x="446" y="831.5" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#334155">卡住时回查，不靠熟悉感</text><rect x="812" y="724" width="344" height="135" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/><text x="830" y="763.0" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#9a3412">勇于实验 · 第 12 章</text><text x="830" y="803.0" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#334155">比较方法、技巧与风格</text><text x="830" y="831.5" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#334155">给足练习，依据结果调整</text><rect x="44" y="897" width="1112" height="162" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="64" y="937.0" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#0f172a">来源与边界</text><text x="64" y="974.0" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#334155">整理者据原书第 4—13 章综合；箭头表示建议流程，不是原书固定步骤。</text><text x="64" y="1004.0" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#334155">这是学习项目图，不是 CBT 概念化、心理诊断或用户已确认的行为模式。</text><text x="64" y="1034.0" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#334155">当前未约定个人学习任务；方法是否适合，需要用真实结果和负担来检验。</text><text x="44" y="1097.0" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#64748b">配套：超速学习-阅读笔记.md  ·  原文定位、案例限制、复习问题与项目模板</text></svg>