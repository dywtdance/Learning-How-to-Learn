<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1030" viewBox="0 0 1600 1030"><title>学习专案：从用途到达标证据</title><defs><marker id="head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="1600" height="1030" fill="#f8fafc"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="50" y="69.80000000000001" fill="#0f172a" font-size="38"><tspan x="50" dy="0">学会了没有？让任务和证据来回答</tspan></text><text x="50" y="115.3" fill="#334155" font-size="23"><tspan x="50" dy="0">Benchmark 是预先说明的参照标准；基线是现在的表现。进步与达标要分别判断。</tspan></text><rect x="50" y="170" width="270" height="160" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.8"/><text x="68" y="217.7" fill="#1d4ed8" font-size="27"><tspan x="68" dy="0">01  用途</tspan></text><text x="68" y="261.1" fill="#334155" font-size="21"><tspan x="68" dy="0">在哪种情境</tspan><tspan x="68" dy="31.5">要完成什么？</tspan></text><polyline points="325,250 348,250" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><rect x="355" y="170" width="270" height="160" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.8"/><text x="373" y="217.7" fill="#1d4ed8" font-size="27"><tspan x="373" dy="0">02  标准</tspan></text><text x="373" y="261.1" fill="#334155" font-size="21"><tspan x="373" dy="0">任务 · 条件 · 质量</tspan><tspan x="373" dy="31.5">关键项怎样才算过？</tspan></text><polyline points="630,250 653,250" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><rect x="660" y="170" width="270" height="160" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="1.8"/><text x="678" y="217.7" fill="#1d4ed8" font-size="27"><tspan x="678" dy="0">03  基线</tspan></text><text x="678" y="261.1" fill="#334155" font-size="21"><tspan x="678" dy="0">先试一次</tspan><tspan x="678" dy="31.5">留下起点与帮助程度</tspan></text><polyline points="935,250 958,250" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><rect x="965" y="170" width="270" height="160" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="1.8"/><text x="983" y="217.7" fill="#1d4ed8" font-size="27"><tspan x="983" dy="0">04  练习</tspan></text><text x="983" y="261.1" fill="#334155" font-size="21"><tspan x="983" dy="0">补知识或练瓶颈</tspan><tspan x="983" dy="31.5">反馈后再试</tspan></text><polyline points="1240,250 1263,250" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><rect x="1270" y="170" width="270" height="160" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="1.8"/><text x="1288" y="217.7" fill="#1d4ed8" font-size="27"><tspan x="1288" dy="0">05  验收</tspan></text><text x="1288" y="261.1" fill="#334155" font-size="21"><tspan x="1288" dy="0">同要求的新任务</tspan><tspan x="1288" dy="31.5">用事先标准核对</tspan></text><polyline points="490,330 490,370 1270,370" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)" stroke-dasharray="9 7"/><text x="630" y="358.0" fill="#0f766e" font-size="20"><tspan x="630" dy="0">标准决定检查什么，不随分数临时降低</tspan></text><polyline points="1405,330 1405,420" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><rect x="960" y="430" width="590" height="150" rx="18" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.8"/><text x="985" y="477.8" fill="#0f766e" font-size="28"><tspan x="985" dy="0">证据要包含“结果＋条件”</tspan></text><text x="985" y="519.1" fill="#334155" font-size="21"><tspan x="985" dy="0">作品／答案／操作记录 ＋ 使用了哪些帮助</tspan><tspan x="985" dy="31.5">自评发现疑点；答案、测试或他人核对关键项</tspan></text><rect x="50" y="430" width="820" height="150" rx="18" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.8"/><text x="75" y="476.7" fill="#6d28d9" font-size="27"><tspan x="75" dy="0">用途决定：是否还要检查保持与迁移？</tspan></text><text x="75" y="519.1" fill="#334155" font-size="21"><tspan x="75" dy="0">当场能做 → 隔时还能否调用 → 换关键条件会不会选方法</tspan><tspan x="75" dy="31.5">若目标要求后两项而尚未测：记为“待验证”。</tspan></text><polyline points="870,505 950,505" fill="none" stroke="#6d28d9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><polyline points="1255,580 1255,610 285,610" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="285,610 285,642" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><polyline points="800,610 800,642" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><polyline points="1255,610 1315,610" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="1315,610 1315,642" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><rect x="50" y="650" width="470" height="150" rx="18" fill="#f0fdf4" stroke="#15803d" stroke-width="1.8"/><text x="72" y="698.8" fill="#15803d" font-size="28"><tspan x="72" dy="0">已达本轮标准</tspan></text><text x="72" y="743.1" fill="#334155" font-size="21"><tspan x="72" dy="0">关键项均满足，证据充分</tspan><tspan x="72" dy="31.5">决定保持、复用或进入下一目标</tspan></text><rect x="565" y="650" width="470" height="150" rx="18" fill="#fff7ed" stroke="#92400e" stroke-width="1.8"/><text x="587" y="698.8" fill="#92400e" font-size="28"><tspan x="587" dy="0">尚未达标</tspan></text><text x="587" y="743.1" fill="#334155" font-size="21"><tspan x="587" dy="0">已测，某个关键项不满足</tspan><tspan x="587" dy="31.5">据差异补练，再用新任务复测</tspan></text><rect x="1080" y="650" width="470" height="150" rx="18" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/><text x="1102" y="698.8" fill="#475569" font-size="28"><tspan x="1102" dy="0">证据不足</tspan></text><text x="1102" y="743.1" fill="#334155" font-size="21"><tspan x="1102" dy="0">任务、条件或核验仍缺失</tspan><tspan x="1102" dy="31.5">先补测，不解释成能力不行</tspan></text><polyline points="800,800 800,870 20,870 20,395 1100,395 1100,340" fill="none" stroke="#92400e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)" stroke-dasharray="9 7"/><text x="315" y="858.1" fill="#92400e" font-size="21"><tspan x="315" dy="0">回到缺口与练习；用途改变时另存标准版本，再作比较</tspan></text><text x="50" y="961.4" fill="#0f172a" font-size="24"><tspan x="50" dy="0">进步：与自己的基线比。达标：与本轮标准比。某项进步不能抵消关键项未满足。</tspan></text><text x="50" y="1001.8" fill="#64748b" font-size="18"><tspan x="50" dy="0">整理者综合：依据《超速学习》4、6—10、13章及《大脑喜欢这样学》3、6章；不是标准化能力测验。</tspan></text></g></svg>