<text x="80" y="73" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="38" fill="#334957"><tspan x="80" dy="0">当下到行动 · 给自己一个可以选择的入口</tspan></text>
<text x="80" y="115" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" fill="#5d7179"><tspan x="80" dy="0">先看清眼前的一件事，再选适合的一条路。情绪可以仍在，计划与检查也保留。</tspan></text>
