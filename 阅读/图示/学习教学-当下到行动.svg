<text x="115" y="1223" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" fill="#334957"><tspan x="115" dy="0">觉察看“是否更清楚需要”；能力仍用 CP0—CP4 检查。不要求先平静，不以投入感代替达标。</tspan></text>
<text x="80" y="1310" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" fill="#657780"><tspan x="80" dy="0">整理者教学图｜依据《当下的力量》第1、3—4、6、8、10章，结合现有学习手册；不表示用户已实践。</tspan></text>
