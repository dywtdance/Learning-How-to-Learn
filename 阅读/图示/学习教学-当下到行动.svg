<text x="635" y="639" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" fill="#334957"><tspan x="635" dy="0">仍不清楚</tspan><tspan x="635" dy="33.0">需要帮助</tspan></text>
<text x="1175" y="639" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" fill="#334957"><tspan x="1175" dy="0">暂时不宜</tspan><tspan x="1175" dy="33.0">继续学习</tspan></text>
