<text x="644" y="383" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" fill="#334957"><tspan x="644" dy="0">眼前发生了什么？</tspan><tspan x="644" dy="34.5">哪句、哪步不明白？</tspan><tspan x="644" dy="34.5">身体或环境需要什么？</tspan></text>
