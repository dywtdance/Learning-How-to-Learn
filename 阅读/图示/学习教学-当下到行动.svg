<text x="160" y="158" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" fill="#334957"><tspan x="160" dy="0">实线：建议的判断与行动接续</tspan></text>
<polyline points="700,155 765,155" fill="none" stroke="#946984" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#return)"/>
<text x="780" y="158" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" fill="#334957"><tspan x="780" dy="0">虚线：根据结果返回检查；不是因果证明</tspan></text>
