<text x="1184" y="873" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" fill="#334957"><tspan x="1184" dy="0">可以休息、拒绝或离开。</tspan><tspan x="1184" dy="34.5">留材料位置与返回问题。</tspan><tspan x="1184" dy="34.5">条件允许时再来。</tspan></text>
