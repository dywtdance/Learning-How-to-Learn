<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1100" viewBox="0 0 1200 1100"><rect width="1200" height="1100" fill="#f8fafc"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><text x="54" y="62.0" font-family="Microsoft YaHei, sans-serif" font-size="32" fill="#0f172a">少有人走的路 · 从阅读到可检验的理解</text><text x="54" y="104.0" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#64748b">于海生译 · 2006 年版｜四部分 47 节｜正文纸页 3–226</text><text x="54" y="152.0" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#1d4ed8">作者框架  /  理解原意，并保留证据边界</text><rect x="54" y="175" width="526" height="180" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="78" y="215.0" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#1e40af">01  自律</text><text x="78" y="257.0" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#334155">推迟满足 · 责任辨别</text><text x="78" y="287.0" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#334155">尊重事实 · 保持平衡</text><text x="78" y="331.0" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#64748b">纸页 3–52</text><rect x="620" y="175" width="526" height="180" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="644" y="215.0" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#1e40af">02  爱</text><text x="644" y="257.0" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#334155">关心与行动 · 倾听与承诺</text><text x="644" y="287.0" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#334155">尊重独立 · 适当边界</text><text x="644" y="331.0" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#64748b">纸页 53–133</text><rect x="54" y="377" width="526" height="180" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="78" y="417.0" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#1e40af">03  成长与宗教</text><text x="78" y="459.0" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#334155">看见自己的世界观</text><text x="78" y="489.0" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#334155">质疑旧地图 · 走向更广经验</text><text x="78" y="533.0" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#64748b">纸页 134–169</text><rect x="620" y="377" width="526" height="180" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="644" y="417.0" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#1e40af">04  神奇的力量</text><text x="644" y="459.0" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#334155">潜意识 · 神恩 · 精神进化</text><text x="644" y="489.0" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#334155">宗教与哲学解释，不视作临床定论</text><text x="644" y="533.0" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#64748b">纸页 170–226</text><text x="54" y="607.0" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#047857">本项目的应用路径  /  整理者提炼，不是原书治疗流程</text><rect x="54" y="636" width="243" height="105" rx="18" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/><text x="74" y="677.0" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#065f46">具体事件</text><text x="74" y="716.0" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#334155">处境、疲劳、资源</text><rect x="337" y="636" width="243" height="105" rx="18" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/><text x="357" y="677.0" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#065f46">待验证解释</text><text x="357" y="716.0" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#334155">责任、预期、习惯</text><rect x="620" y="636" width="243" height="105" rx="18" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/><text x="640" y="677.0" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#065f46">共同选择</text><text x="640" y="716.0" font-family="Microsoft YaHei, sans-serif" font-si