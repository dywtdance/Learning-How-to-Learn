<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160"><title>学习的三个循环：一次学习怎样接成一个专案</title><defs><marker id="head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="1600" height="1160" fill="#f8fafc"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="45" y="66.80000000000001" fill="#0f172a" font-size="38"><tspan x="45" dy="0">小循环留下理解，大循环检验能否连用</tspan></text><text x="45" y="117.4" fill="#334155" font-size="24"><tspan x="45" dy="0">先走完一次，再逐步减少提示。检查点决定下一步；日期只是起步安排。</tspan></text><rect x="45" y="155" width="1510" height="270" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.8"/><text x="70" y="205.9" fill="#1d4ed8" font-size="29"><tspan x="70" dy="0">每次学习  /  一个小问题</tspan></text><rect x="75" y="235" width="330" height="110" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="1.8"/><text x="91" y="278.6" fill="#1d4ed8" font-size="26"><tspan x="91" dy="0">带问题输入</tspan></text><text x="91" y="319.0" fill="#334155" font-size="20"><tspan x="91" dy="0">看一个解释与例子</tspan></text><polyline points="410,285 435,285" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><rect x="445" y="235" width="330" height="110" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="1.8"/><text x="461" y="278.6" fill="#1d4ed8" font-size="26"><tspan x="461" dy="0">自己解释</tspan></text><text x="461" y="319.0" fill="#334155" font-size="20"><tspan x="461" dy="0">留下来源与条件</tspan></text><polyline points="780,285 805,285" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><rect x="815" y="235" width="330" height="110" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="1.8"/><text x="831" y="278.6" fill="#1d4ed8" font-size="26"><tspan x="831" dy="0">不看材料小测</tspan></text><text x="831" y="319.0" fill="#334155" font-size="20"><tspan x="831" dy="0">保留原答，再核对</tspan></text><polyline points="1150,285 1175,285" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><rect x="1185" y="235" width="330" height="110" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="1.8"/><text x="1201" y="278.6" fill="#1d4ed8" font-size="26"><tspan x="1201" dy="0">纠错并连接</tspan></text><text x="1201" y="319.0" fill="#334155" font-size="20"><tspan x="1201" dy="0">写明关联，留返回入口</tspan></text><text x="75" y="392.3" fill="#1d4ed8" font-size="23"><tspan x="75" dy="0">CP1：能解释＋做一个例子＋指出条件。下一次先回想，补上隔时证据。</tspan></text><polyline points="1360,425 1360,475" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><text x="600" y="457.2" fill="#0f766e" font-size="22"><tspan x="600" dy="0">内容能共同回答一个问题，或出现矛盾 → 整合</tspan></text><rect x="45" y="485" width="1510" height="230" rx="18" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.8"/><text x="70" y="533.9" fill="#0f766e" font-size="29"><tspan x="70" dy="0">单元整合  /  把分散理解变成判断路径</tspan></text><text x="75" y="592.5" fill="#334155" font-size="25"><tspan x="75" dy="0">先闭卷画骨架 → 打开笔记核对 → 写明关系与修改理由 → 做跨笔记任务 → 更新主题页</tspan></text><text x="75" y="652.3" fill="#0f766e" font-size="23"><tspan x="75" dy="0">CP2：能解释各环节为何相连，并实际联合使用。只会背单条，就补关系与对照例。</tspan></text><polyline points="1360,715 1360,765" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><text x="570" y="749.2" fill="#6d28d9" font-size="22"><tspan x="570" dy="0">多个环节能服务目标任务 → 用预留的新任务综合检验</tspan></text><rect x="45" y="775" width="1510" height="225" rx="18" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.8"/><text x="70" y="823.9" fill="#6d28d9" font-size="29"><tspan x="70" dy="0">专案验收  /  按事先约定的标准看证据</tspan></text><text x="75" y="878.6" fill="#334155" font-size="26"><tspan x="75" dy="0">独立新任务 → 逐项核对 → 定位缺口 → 补练后换新任务复测</tspan></text><text x="75" y="937.3" fill="#6d28d9" font-size="23"><tspan x="75" dy="0">CP3：本轮综合达标。若要求长期调用，再做CP4延迟检查；未测就记待验证。</tspan></text><polyline points="1530,910 1580,910 1580,130 1380,130 1380,155" fill="none" stroke="#b45309" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)" stroke-dasharray="9 7"/><text x="45" y="1068.6" fill="#92400e" font-size="26"><tspan x="45" dy="0">反馈返回具体缺口：信息、关系、策略或操作。不是重新抄写全部笔记。</tspan></text><text x="45" y="1124.8" fill="#64748b" font-size="18"><tspan x="45" dy="0">依据：卡片笔记的即时关联与主题概览；超速学习的直接练习、提取、反馈与保持。三层循环和CP编号为教学设计。</tspan></text></g></svg>