<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1580" viewBox="0 0 2200 1580"><title>学会学习：从内容分析到模式识别的知识关系图</title><defs><marker id="head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="2200" height="1580" fill="#f8fafc"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="65" y="80.4" fill="#0f172a" font-size="44"><tspan x="65" dy="0">学会学习：把内容组织成能用的知识与技能</tspan></text><text x="65" y="127.5" fill="#475569" font-size="25"><tspan x="65" dy="0">后设学习确定方向；内容与掌握要求影响策略；反馈不断修正理解、动作与适用条件。</tspan></text><polyline points="245,743 385,743" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><polyline points="580,720 700,720 700,389 835,389" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><polyline points="580,775 700,775 700,1069 835,1069" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><polyline points="1050,389 1195,389" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><polyline points="1050,1069 1195,1069" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><polyline points="1455,389 1535,389 1535,691" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><polyline points="1425,1069 1535,1069 1535,815" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><polyline points="1665,743 1830,743" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><text x="65" y="742.4" fill="#9a3412" font-size="34"><tspan x="65" dy="0">后设学习</tspan></text><polyline points="65,762.0 201,762.0" fill="none" stroke="#9a3412" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="65" y="795.3" fill="#334155" font-size="23"><tspan x="65" dy="0">先研究怎样学</tspan></text><text x="410" y="742.4" fill="#9a3412" font-size="34"><tspan x="410" dy="0">分析内容</tspan></text><polyline points="410,762.0 546,762.0" fill="none" stroke="#9a3412" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="410" y="804.2" fill="#334155" font-size="22"><tspan x="410" dy="0">同一任务常含三类</tspan></text><text x="850" y="387.4" fill="#1d4ed8" font-size="34"><tspan x="850" dy="0">理解与提取</tspan></text><polyline points="850,407.0 1020,407.0" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="850" y="439.2" fill="#1d4ed8" font-size="22"><tspan x="850" dy="0">陈述性知识：能说明、能回想</tspan></text><text x="1210" y="387.4" fill="#1d4ed8" font-size="34"><tspan x="1210" dy="0">解释／主动提取</tspan></text><polyline points="1210,407.0 1448,407.0" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="1210" y="439.2" fill="#334155" font-size="22"><tspan x="1210" dy="0">讲出理由；离开材料再试</tspan></text><text x="850" y="1067.4" fill="#047857" font-size="34"><tspan x="850" dy="0">操作与练习</tspan></text><polyline points="850,1087.0 1020,1087.0" fill="none" stroke="#047857" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="850" y="1119.2" fill="#047857" font-size="22"><tspan x="850" dy="0">程序性技能：实际执行</tspan></text><text x="1210" y="1067.4" fill="#047857" font-size="34"><tspan x="1210" dy="0">直接任务</tspan></text><polyline points="1210,1087.0 1346,1087.0" fill="none" stroke="#047857" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="1210" y="1119.2" fill="#334155" font-size="22"><tspan x="1210" dy="0">接近用途；必要时模拟</tspan></text><text x="1475" y="742.4" fill="#9a3412" font-size="34"><tspan x="1475" dy="0">反馈修正</tspan></text><polyline points="1475,762.0 1611,762.0" fill="none" stroke="#9a3412" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="1475" y="804.2" fill="#334155" font-size="22"><tspan x="1475" dy="0">核对结果、错误位置与改法</tspan></text><text x="1845" y="742.4" fill="#9f1239" font-size="34"><tspan x="1845" dy="0">模式识别与迁移</tspan></text><polyline points="1845,762.0 2083,762.0" fill="none" stroke="#9f1239" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="1845" y="804.2" fill="#334155" font-size="22"><tspan x="1845" dy="0">换情境后仍能判断与使用</tspan></text><polyline points="145,690 145,260" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="145,270 185,270" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="195" y="280.8" fill="#9a3412" font-size="28"><tspan x="195" dy="0">为什么学</tspan></text><text x="195" y="320.2" fill="#334155" font-size="22"><tspan x="195" dy="0">用途、兴趣与目标任务</tspan></text><polyline points="145,400 185,400" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="195" y="410.8" fill="#9a3412" font-size="28"><tspan x="195" dy="0">学习什么</tspan></text><text x="195" y="450.2" fill="#334155" font-size="22"><tspan x="195" dy="0">范围、前置知识与重点</tspan></text><polyline points="145,530 185,530" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="195" y="540.8" fill="#9a3412" font-size="28"><tspan x="195" dy="0">如何去学</tspan></text><text x="195" y="580.2" fill="#334155" font-size="22"><tspan x="195" dy="0">参考路径、资源与检验</tspan></text><text x="65" y="900.3" fill="#334155" font-size="23"><tspan x="65" dy="0">先有可调整的起点</tspan><tspan x="65" dy="34.5">不要求把所有方法研究完</tspan></text><text x="267" y="714.2" fill="#9a3412" font-size="22"><tspan x="267" dy="0">决定取舍</tspan></text><polyline points="480,690 480,595" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="480,595 420,595 420,525" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="480,595 580,595 580,525" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="380" y="480.8" fill="#1d4ed8" font-size="28"><tspan x="380" dy="0">事实</tspan></text><polyline points="380,498.0 436,498.0" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="365" y="528.1" fill="#334155" font-size="21"><tspan x="365" dy="0">需要记住</tspan></text><text x="545" y="480.8" fill="#1d4ed8" font-size="28"><tspan x="545" dy="0">概念</tspan></text><polyline points="545,498.0 601,498.0" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="530" y="528.1" fill="#334155" font-size="21"><tspan x="530" dy="0">需要理解</tspan></text><polyline points="480,815 480,920" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="425" y="965.8" fill="#047857" font-size="28"><tspan x="425" dy="0">程序</tspan></text><polyline points="425,983.0 481,983.0" fill="none" stroke="#047857" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="410" y="1013.1" fill="#334155" font-size="21"><tspan x="410" dy="0">需要练习</tspan></text><text x="405" y="1159.2" fill="#475569" font-size="22"><tspan x="405" dy="0">内容类型帮助选策略</tspan><tspan x="405" dy="33.0">不等于已经掌握技能</tspan></text><text x="715" y="318.1" fill="#1d4ed8" font-size="21"><tspan x="715" dy="0">事实、概念通常偏重</tspan></text><text x="870" y="218.6" fill="#1d4ed8" font-size="26"><tspan x="870" dy="0">输入 → 联系已有知识 → 组块</tspan></text><text x="870" y="264.2" fill="#334155" font-size="22"><tspan x="870" dy="0">比较、例子与反例：说明关系及条件</tspan></text><polyline points="965,285 965,335" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><text x="1210" y="514.2" fill="#475569" font-size="22"><tspan x="1210" dy="0">能想起 ≠ 一定正确</tspan><tspan x="1210" dy="33.0">输出还要接受核对</tspan></text><polyline points="920,465 920,992" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><text x="940" y="559.2" fill="#1d4ed8" font-size="22"><tspan x="940" dy="0">原理与条件</tspan><tspan x="940" dy="33.0">帮助选择动作</tspan></text><polyline points="1100,995 1100,470" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><text x="1120" y="804.2" fill="#047857" font-size="22"><tspan x="1120" dy="0">实践暴露</tspan><tspan x="1120" dy="33.0">理解缺口</tspan></text><text x="956" y="691.4" fill="#0f172a" font-size="24"><tspan x="956" dy="0">两条路线</tspan><tspan x="956" dy="36.0">相互支持</tspan></text><polyline points="1340,470 1450,470 1450,975 1340,975" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7"/><text x="1220" y="647.5" fill="#6d28d9" font-size="25"><tspan x="1220" dy="0">间隔安排</tspan></text><text x="1220" y="693.1" fill="#6d28d9" font-size="21"><tspan x="1220" dy="0">再提取／再练习</tspan><tspan x="1220" dy="31.5">检验隔时可用性</tspan></text><polyline points="1600,840 1600,1260 1360,1260" fill="none" stroke="#047857" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)" stroke-dasharray="9 7"/><text x="1100" y="1251.9" fill="#047857" font-size="29"><tspan x="1100" dy="0">针对瓶颈操练</tspan></text><polyline points="1100,1269.5 1274,1269.5" fill="none" stroke="#047857" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="1100" y="1304.2" fill="#334155" font-size="22"><tspan x="1100" dy="0">先从整体找卡点；单练后回到整体</tspan></text><polyline points="1220,1205 1220,1140" fill="none" stroke="#047857" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)" stroke-dasharray="9 7"/><polyline points="1500,830 1500,1405 775,1405 775,475" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)" stroke-dasharray="9 7"/><text x="900" y="1384.2" fill="#475569" font-size="22"><tspan x="900" dy="0">反馈也会要求补知识、改关系，甚至重设学习计划</tspan></text><polyline points="1970,690 2120,690 2120,280" fill="none" stroke="#9f1239" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="2120,280 2070,280" fill="none" stroke="#9f1239" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="1665" y="285.8" fill="#9f1239" font-size="28"><tspan x="1665" dy="0">共同结构</tspan></text><text x="1665" y="323.1" fill="#334155" font-size="21"><tspan x="1665" dy="0">比较多个案例，寻找深层关系</tspan></text><polyline points="2120,405 2070,405" fill="none" stroke="#9f1239" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="1665" y="410.8" fill="#9f1239" font-size="28"><tspan x="1665" dy="0">适用条件</tspan></text><text x="1665" y="448.1" fill="#334155" font-size="21"><tspan x="1665" dy="0">用反例与条件变化检查边界</tspan></text><polyline points="2120,530 2070,530" fill="none" stroke="#9f1239" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="1665" y="535.8" fill="#9f1239" font-size="28"><tspan x="1665" dy="0">策略选择</tspan></text><text x="1665" y="573.1" fill="#334155" font-size="21"><tspan x="1665" dy="0">根据结构选方法，而非只认题面</tspan></text><text x="1820" y="970.3" fill="#9f1239" font-size="23"><tspan x="1820" dy="0">新情境：能否解释、选对并用出？</tspan></text><polyline points="1980,835 1980,920" fill="none" stroke="#9f1239" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><polyline points="1980,1000 1980,1165 1685,1165 1685,825" fill="none" stroke="#9f1239" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)" stroke-dasharray="9 7"/><text x="1740" y="1224.2" fill="#9f1239" font-size="22"><tspan x="1740" dy="0">不成立 → 修正模式与适用范围</tspan></text><text x="1705" y="1339.2" fill="#475569" font-size="22"><tspan x="1705" dy="0">模式是逐步形成、持续校验的理解</tspan><tspan x="1705" dy="33.0">不是练习次数达到门槛后的自动结果</tspan></text><text x="65" y="1486.4" fill="#334155" font-size="24"><tspan x="65" dy="0">贯穿条件：专注、休息、现实资源与支持。主线为综合编排；蓝／绿是侧重点，不是互斥的学习者类型。</tspan></text><text x="65" y="1533.1" fill="#64748b" font-size="21"><tspan x="65" dy="0">来源：U4、6—11、13；B2、3—7。U＝《超速学习》，B＝《大脑喜欢这样学》。关系依据与七步推导见配套文档。</tspan></text></g></svg>