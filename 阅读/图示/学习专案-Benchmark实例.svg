<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000"><title>提问专案：从模糊问题到可核验的达标标准</title><defs><marker id="head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="1500" height="1000" fill="#f8fafc"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="50" y="64.6" fill="#0f172a" font-size="36"><tspan x="50" dy="0">一个专案示范：提出可回答的问题</tspan></text><text x="50" y="109.2" fill="#334155" font-size="22"><tspan x="50" dy="0">示例设计，非用户测评结果。用任务表现核对“是否能用”。</tspan></text><rect x="50" y="150" width="430" height="170" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="1.8"/><text x="72" y="198.7" fill="#92400e" font-size="27"><tspan x="72" dy="0">模糊起点</tspan></text><text x="72" y="244.2" fill="#334155" font-size="22"><tspan x="72" dy="0">“这个功能为什么不行？”</tspan><tspan x="72" dy="33.0">读者还要猜目标、现象和请求。</tspan></text><polyline points="495,235 560,235" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><rect x="580" y="150" width="870" height="170" rx="18" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.8"/><text x="605" y="198.7" fill="#0f766e" font-size="27"><tspan x="605" dy="0">可核验的表达</tspan></text><text x="605" y="242.4" fill="#334155" font-size="24"><tspan x="605" dy="0">“我想实现X，预期A，实际B；试了C，结果D。</tspan><tspan x="605" dy="36.0">我怀疑E但未证实，希望你帮我核对F。”</tspan></text><text x="50" y="396.9" fill="#0f172a" font-size="29"><tspan x="50" dy="0">验收尺：写出来后，按同一组关键项检查</tspan></text><rect x="50" y="420" width="1400" height="72" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8"/><text x="70" y="462.3" fill="#1d4ed8" font-size="23"><tspan x="70" dy="0">情境清楚</tspan></text><text x="300" y="461.2" fill="#334155" font-size="22"><tspan x="300" dy="0">读者能复述目标与关键差异</tspan></text><text x="850" y="459.0" fill="#334155" font-size="20"><tspan x="850" dy="0">指出稿件中对应的内容</tspan></text><rect x="50" y="503" width="1400" height="72" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8"/><text x="70" y="545.3" fill="#1d4ed8" font-size="23"><tspan x="70" dy="0">依据诚实</tspan></text><text x="300" y="544.2" fill="#334155" font-size="22"><tspan x="300" dy="0">已观察、已尝试、猜测分开</tspan></text><text x="850" y="542.0" fill="#334155" font-size="20"><tspan x="850" dy="0">无虚构尝试或未经证实的定论</tspan></text><rect x="50" y="586" width="1400" height="72" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8"/><text x="70" y="628.3" fill="#1d4ed8" font-size="23"><tspan x="70" dy="0">请求具体</tspan></text><text x="300" y="627.2" fill="#334155" font-size="22"><tspan x="300" dy="0">读者知道希望检查什么</tspan></text><text x="850" y="625.0" fill="#334155" font-size="20"><tspan x="850" dy="0">请求范围可理解、有边界</tspan></text><rect x="50" y="669" width="1400" height="72" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8"/><text x="70" y="711.3" fill="#1d4ed8" font-size="23"><tspan x="70" dy="0">独立与迁移</tspan></text><text x="300" y="710.2" fill="#334155" font-size="22"><tspan x="300" dy="0">按约定帮助条件，换场景仍能组织</tspan></text><text x="850" y="708.0" fill="#334155" font-size="20"><tspan x="850" dy="0">可看自制清单；验收时AI不代写</tspan></text><rect x="50" y="798" width="1400" height="120" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.8"/><text x="75" y="843.7" fill="#1d4ed8" font-size="27"><tspan x="75" dy="0">本例的达标规则</tspan></text><text x="75" y="882.1" fill="#334155" font-size="21"><tspan x="75" dy="0">两个未练过的不同场景均满足四项，且关键判断已核对；这是可调整的示范门槛。</tspan><tspan x="75" dy="31.5">尚未完成新场景验收 → 证据不足。对方是否回复、文字长短，不作能力达标条件。</tspan></text><text x="50" y="977.0" fill="#64748b" font-size="20"><tspan x="50" dy="0">数量与帮助条件需按真实用途约定；若目标包含长期保持，再安排延迟复测。不是通用分数线。</tspan></text></g></svg>