<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 800 600"><rect width="800" height="600" fill="#fff"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#64748b"/></marker></defs>
<text x="40" y="63" font-family="Microsoft YaHei, sans-serif" font-size="28" fill="#1e293b"><tspan x="40" dy="0">从共同语言，到可验证的改变</tspan></text>
<text x="40" y="98" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#475569"><tspan x="40" dy="0">书中概念是理解工具；个人模式需要实际证据</tspan></text>
<rect x="40" y="130" width="200" height="100" rx="14" fill="#a5d8ff" stroke="#64748b" stroke-width="1.5"/>
<text x="20" y="172" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#1e293b"><tspan x="20" dy="0">1 核对原文</tspan><tspan x="20" dy="28">书名 · 章节 · 页码</tspan></text>
<rect x="300" y="130" width="200" height="100" rx="14" fill="#a5d8ff" stroke="#64748b" stroke-width="1.5"/>
<text x="310" y="172" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#1e293b"><tspan x="310" dy="0">2 对齐词义</tspan><tspan x="310" dy="28">作者语境 · 译法</tspan></text>
<rect x="560" y="130" width="200" height="100" rx="14" fill="#a5d8ff" stroke="#64748b" stroke-width="1.5"/>
<text x="580" y="172" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#1e293b"><tspan x="580" dy="0">3 回到具体经历</tspan><tspan x="580" dy="28">发生了什么</tspan></text>
<rect x="560" y="330" width="200" height="100" rx="14" fill="#fff3bf" stroke="#64748b" stroke-width="1.5"/>
<text x="580" y="372" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#1e293b"><tspan x="580" dy="0">4 提出模式假设</tspan><tspan x="580" dy="28">保留其他解释</tspan></text>
<rect x="300" y="330" width="200" height="100" rx="14" fill="#d0bfff" stroke="#64748b" stroke-width="1.5"/>
<text x="330" y="372" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#1e293b"><tspan x="330" dy="0">5 商定小实践</tspan><tspan x="330" dy="28">明确观察什么</tspan></text>
<rect x="40" y="330" width="200" height="100" rx="14" fill="#b2f2bb" stroke="#64748b" stroke-width="1.5"/>
<text x="60" y="372" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#1e293b"><tspan x="60" dy="0">6 查看真实反馈</tspan><tspan x="60" dy="28">修正理解与做法</tspan></text>
<path d="M240 180 L300 180" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M500 180 L560 180" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M660 230 L660 330" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M560 380 L500 380" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M300 380 L240 380" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="498" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#475569"><tspan x="40" dy="0">每次只推进一个问题，不把假设画成诊断。</tspan><tspan x="40" dy="25.2">阅读进度单独记录：提取 ≠ 浏览 ≠ 选段核查 ≠ 通读。</tspan></text>
