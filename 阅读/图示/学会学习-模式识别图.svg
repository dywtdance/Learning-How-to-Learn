<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1560" viewBox="0 0 1700 1560"><title>学习模式识别：现象、检查与可选调整</title><defs><marker id="head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="1700" height="1560" fill="#f8fafc"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="50" y="72.0" fill="#0f172a" font-size="40"><tspan x="50" dy="0">卡住时，先识别哪一环需要调整</tspan></text><text x="50" y="117.5" fill="#475569" font-size="25"><tspan x="50" dy="0">候选检查路径，不是对你的分类。每次只选一行，用真实结果检验。</tspan></text><rect x="50" y="148" width="1600" height="66" rx="18" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.8"/><text x="74" y="193.6" fill="#115e59" font-size="26"><tspan x="74" dy="0">先看现实条件：任务是否清楚？基础与资料是否足够？是否疲劳、被打断，或需要支持？</tspan></text><text x="50" y="273.7" fill="#0f172a" font-size="27"><tspan x="50" dy="0">看见什么现象</tspan></text><text x="570" y="273.7" fill="#0f172a" font-size="27"><tspan x="570" dy="0">先检查什么</tspan></text><text x="1140" y="273.7" fill="#0f172a" font-size="27"><tspan x="1140" dy="0">可选的下一步</tspan></text><rect x="50" y="302" width="440" height="108" rx="18" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.8"/><text x="70" y="349.3" fill="#0f172a" font-size="23"><tspan x="70" dy="0">收藏、计划很多，没开始</tspan></text><rect x="570" y="302" width="490" height="108" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8"/><text x="590" y="349.3" fill="#334155" font-size="23"><tspan x="590" dy="0">现有资料能否支持一次小尝试？</tspan><tspan x="590" dy="34.5">具体缺什么，还是范围太大？</tspan></text><rect x="1140" y="302" width="510" height="108" rx="18" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.8"/><text x="1160" y="349.3" fill="#334155" font-size="23"><tspan x="1160" dy="0">缩小为一项产出</tspan><tspan x="1160" dy="34.5">暂停无关收集，补必要条件</tspan></text><polyline points="502,356 558,356" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><polyline points="1072,356 1128,356" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><rect x="50" y="435" width="440" height="108" rx="18" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.8"/><text x="70" y="482.3" fill="#0f172a" font-size="23"><tspan x="70" dy="0">看着懂，关掉材料讲不出</tspan></text><rect x="570" y="435" width="490" height="108" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8"/><text x="590" y="482.3" fill="#334155" font-size="23"><tspan x="590" dy="0">是想不起，还是关系没理解？</tspan><tspan x="590" dy="34.5">能否解释一点并举例？</tspan></text><rect x="1140" y="435" width="510" height="108" rx="18" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.8"/><text x="1160" y="482.3" fill="#334155" font-size="23"><tspan x="1160" dy="0">想不起：回想 + 适当提示</tspan><tspan x="1160" dy="34.5">不理解：查例子、关系与条件</tspan></text><polyline points="502,489 558,489" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><polyline points="1072,489 1128,489" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><rect x="50" y="568" width="440" height="108" rx="18" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.8"/><text x="70" y="615.3" fill="#0f172a" font-size="23"><tspan x="70" dy="0">会讲，但独立任务做不出</tspan></text><rect x="570" y="568" width="490" height="108" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8"/><text x="590" y="615.3" fill="#334155" font-size="23"><tspan x="590" dy="0">做一次小任务</tspan><tspan x="590" dy="34.5">定位第一处实际卡点</tspan></text><rect x="1140" y="568" width="510" height="108" rx="18" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.8"/><text x="1160" y="615.3" fill="#334155" font-size="23"><tspan x="1160" dy="0">补示例或练一个子技能</tspan><tspan x="1160" dy="34.5">再回到完整任务检查</tspan></text><polyline points="502,622 558,622" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><polyline points="1072,622 1128,622" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><rect x="50" y="701" width="440" height="108" rx="18" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.8"/><text x="70" y="748.3" fill="#0f172a" font-size="23"><tspan x="70" dy="0">熟题会，换个条件就错</tspan></text><rect x="570" y="701" width="490" height="108" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8"/><text x="590" y="748.3" fill="#334155" font-size="23"><tspan x="590" dy="0">是否只认表面线索？</tspan><tspan x="590" dy="34.5">两种相近情境，关键差别在哪？</tspan></text><rect x="1140" y="701" width="510" height="108" rx="18" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.8"/><text x="1160" y="748.3" fill="#334155" font-size="23"><tspan x="1160" dy="0">比较适用例与反例</tspan><tspan x="1160" dy="34.5">练习判断何时选哪种方法</tspan></text><polyline points="502,755 558,755" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><polyline points="1072,755 1128,755" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><rect x="50" y="834" width="440" height="108" rx="18" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.8"/><text x="70" y="881.3" fill="#0f172a" font-size="23"><tspan x="70" dy="0">反复练，同类错误仍出现</tspan></text><rect x="570" y="834" width="490" height="108" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8"/><text x="590" y="881.3" fill="#334155" font-size="23"><tspan x="590" dy="0">反馈告诉我哪里错了吗？</tspan><tspan x="590" dy="34.5">练的环节真限制整体吗？</tspan></text><rect x="1140" y="834" width="510" height="108" rx="18" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.8"/><text x="1160" y="881.3" fill="#334155" font-size="23"><tspan x="1160" dy="0">取得具体错误与改法</tspan><tspan x="1160" dy="34.5">专项练习后复查整体表现</tspan></text><polyline points="502,888 558,888" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><polyline points="1072,888 1128,888" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><rect x="50" y="967" width="440" height="108" rx="18" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.8"/><text x="70" y="1014.3" fill="#0f172a" font-size="23"><tspan x="70" dy="0">当时会，隔一段时间忘了</tspan></text><rect x="570" y="967" width="490" height="108" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8"/><text x="590" y="1014.3" fill="#334155" font-size="23"><tspan x="590" dy="0">先试核心任务，不急着重读</tspan><tspan x="590" dy="34.5">哪些值得保持，哪些可随用随查？</tspan></text><rect x="1140" y="967" width="510" height="108" rx="18" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.8"/><text x="1160" y="1014.3" fill="#334155" font-size="23"><tspan x="1160" dy="0">间隔提取、调整复习范围</tspan><tspan x="1160" dy="34.5">低频内容保留检索入口</tspan></text><polyline points="502,1021 558,1021" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><polyline points="1072,1021 1128,1021" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><rect x="50" y="1100" width="440" height="108" rx="18" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.8"/><text x="70" y="1147.3" fill="#0f172a" font-size="23"><tspan x="70" dy="0">“缓一下”之后没有回来</tspan></text><rect x="570" y="1100" width="490" height="108" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8"/><text x="590" y="1147.3" fill="#334155" font-size="23"><tspan x="590" dy="0">当时是否需要恢复？</tspan><tspan x="590" dy="34.5">停在哪里、回来做什么清楚吗？</tspan></text><rect x="1140" y="1100" width="510" height="108" rx="18" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.8"/><text x="1160" y="1147.3" fill="#334155" font-size="23"><tspan x="1160" dy="0">按状态休息或缩小任务</tspan><tspan x="1160" dy="34.5">留下进度、下一步与返回线索</tspan></text><polyline points="502,1154 558,1154" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><polyline points="1072,1154 1128,1154" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><rect x="50" y="1233" width="440" height="108" rx="18" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.8"/><text x="70" y="1280.3" fill="#0f172a" font-size="23"><tspan x="70" dy="0">卡住了，却一直没提问</tspan></text><rect x="570" y="1233" width="490" height="108" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8"/><text x="590" y="1280.3" fill="#334155" font-size="23"><tspan x="590" dy="0">能否说清目标、尝试与阻塞点？</tspan><tspan x="590" dy="34.5">对方或渠道是否适合？</tspan></text><rect x="1140" y="1233" width="510" height="108" rx="18" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.8"/><text x="1160" y="1280.3" fill="#334155" font-size="23"><tspan x="1160" dy="0">整理一个有范围的问题</tspan><tspan x="1160" dy="34.5">查可靠材料，或选择合适对象</tspan></text><polyline points="502,1287 558,1287" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><polyline points="1072,1287 1128,1287" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><rect x="50" y="1400" width="1600" height="93" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="1.8"/><text x="75" y="1442.5" fill="#9a3412" font-size="25"><tspan x="75" dy="0">调整后复查：具体表现有没有改善？负担是否可承受？</tspan><tspan x="75" dy="37.5">没有改善，就修正解释、方法或条件；一次现象不能证明固定模式。</tspan></text><text x="50" y="1538.0" fill="#64748b" font-size="20"><tspan x="50" dy="0">依据两本学习书综合改编；“缓一下”与提问相关解释仍待具体事件核对。完整条件与来源见配套文档。</tspan></text></g></svg>