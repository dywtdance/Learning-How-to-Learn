<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1100" viewBox="0 0 1200 1100"><title>大脑喜欢这样学：学习过程与反馈</title><defs><marker id="head" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#64748b" stroke-width="1.4"/></marker></defs><rect width="1200" height="1100" fill="#f8fafc"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="50" y="67.4" fill="#0f172a" font-size="34"><tspan x="50" dy="0">大脑喜欢这样学 · 从理解走向能用</tspan></text><text x="50" y="110.0" fill="#64748b" font-size="20"><tspan x="50" dy="0">学习方法类  /  黄翔 · 2024 年版  /  依据全书方法整理，非脑内机制实测图</tspan></text><rect x="50" y="137" width="1100" height="56" rx="18" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.6"/><text x="72" y="174.2" fill="#075985" font-size="22"><tspan x="72" dy="0">看见三个层次：当时理解 → 离开材料能做 → 隔一段时间、换个情境还能用</tspan></text><rect x="50" y="235" width="330" height="165" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/><text x="70" y="283.6" fill="#0f172a" font-size="26"><tspan x="70" dy="0">01  明确目标</tspan></text><text x="70" y="333.0" fill="#334155" font-size="20"><tspan x="70" dy="0">想在什么场景完成什么？</tspan><tspan x="70" dy="30.0">用任务结果检验，不只计时。</tspan></text><rect x="435" y="235" width="330" height="165" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/><text x="455" y="283.6" fill="#0f172a" font-size="26"><tspan x="455" dy="0">02  理解输入</tspan></text><text x="455" y="333.0" fill="#334155" font-size="20"><tspan x="455" dy="0">带着问题读一小段或看示例。</tspan><tspan x="455" dy="30.0">遇到基础缺口，补必要部分。</tspan></text><rect x="820" y="235" width="330" height="165" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/><text x="840" y="283.6" fill="#0f172a" font-size="26"><tspan x="840" dy="0">03  建立联系</tspan></text><text x="840" y="333.0" fill="#334155" font-size="20"><tspan x="840" dy="0">联系已有知识，解释为什么。</tspan><tspan x="840" dy="30.0">举适用例，也找不适用例。</tspan></text><rect x="50" y="490" width="330" height="165" rx="18" fill="#f0fdf4" stroke="#86efac" stroke-width="1.6"/><text x="70" y="538.6" fill="#0f172a" font-size="26"><tspan x="70" dy="0">06  间隔再试</tspan></text><text x="70" y="588.0" fill="#334155" font-size="20"><tspan x="70" dy="0">休息后、隔一段时间再检查。</tspan><tspan x="70" dy="30.0">看保持与迁移，再调整计划。</tspan></text><rect x="435" y="490" width="330" height="165" rx="18" fill="#f0fdf4" stroke="#86efac" stroke-width="1.6"/><text x="455" y="538.6" fill="#0f172a" font-size="26"><tspan x="455" dy="0">05  核对与修正</tspan></text><text x="455" y="588.0" fill="#334155" font-size="20"><tspan x="455" dy="0">对照标准，定位具体缺口。</tspan><tspan x="455" dy="30.0">保留一条可执行的修改。</tspan></text><rect x="820" y="490" width="330" height="165" rx="18" fill="#f0fdf4" stroke="#86efac" stroke-width="1.6"/><text x="840" y="538.6" fill="#0f172a" font-size="26"><tspan x="840" dy="0">04  主动输出</tspan></text><text x="840" y="588.0" fill="#334155" font-size="20"><tspan x="840" dy="0">合上材料回想、解释或操作。</tspan><tspan x="840" dy="30.0">把“熟悉”与“会做”分开。</tspan></text><polyline points="385,316 425,316" fill="none" stroke="#64748b" stroke-width="2.4" marker-end="url(#head)"/><polyline points="770,316 810,316" fill="none" stroke="#64748b" stroke-width="2.4" marker-end="url(#head)"/><polyline points="985,410 985,479" fill="none" stroke="#64748b" stroke-width="2.4" marker-end="url(#head)"/><polyline points="810,570 775,570" fill="none" stroke="#64748b" stroke-width="2.4" marker-end="url(#head)"/><polyline points="425,570 390,570" fill="none" stroke="#64748b" stroke-width="2.4" marker-end="url(#head)"/><text x="1010" y="454.8" fill="#64748b" font-size="18"><tspan x="1010" dy="0">尝试后再核对</tspan></text><polyline points="215,480 215,435 600,435 600,410" fill="none" stroke="#64748b" stroke-width="2.4" marker-end="url(#head)"/><text x="300" y="426.8" fill="#64748b" font-size="18"><tspan x="300" dy="0">发现缺口，回到对应环节</tspan></text><rect x="50" y="705" width="1100" height="134" rx="18" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.6"/><text x="73" y="748.4" fill="#115e59" font-size="24"><tspan x="73" dy="0">贯穿全程的条件</tspan></text><text x="73" y="791.1" fill="#115e59" font-size="21"><tspan x="73" dy="0">可承受的任务量  ·  合适的环境与资源  ·  睡眠、休息与身体状态  ·  现实压力与支持</tspan><tspan x="73" dy="31.5">暂停时留下：当前进度 + 未解决问题 + 回来从哪里开始</tspan></text><rect x="50" y="872" width="1100" height="134" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="1.6"/><text x="73" y="915.4" fill="#9a3412" font-size="24"><tspan x="73" dy="0">使用边界</tspan></text><text x="73" y="956.1" fill="#9a3412" font-size="21"><tspan x="73" dy="0">这是备选学习流程，不是已约定练习或个人诊断。</tspan><tspan x="73" dy="31.5">不按固定记忆率、递质类型或 90 分钟周期评价自己；具体核查见阅读笔记。</tspan></text><text x="50" y="1057.8" fill="#64748b" font-size="18"><tspan x="50" dy="0">原书第 3—7 章为主；任务恢复入口为整理者改编。观察实际结果，再决定是否保留方法。</tspan></text></g></svg>