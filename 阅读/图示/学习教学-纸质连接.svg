<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1110" viewBox="0 0 1500 1110"><title>纸质笔记的关联：稳定地址、关系说明与主题入口</title><defs><marker id="head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="1500" height="1110" fill="#f8fafc"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="45" y="65.7" fill="#0f172a" font-size="37"><tspan x="45" dy="0">纸张可以分开，解释要有可走的路线</tspan></text><text x="45" y="112.3" fill="#334155" font-size="23"><tspan x="45" dy="0">示例：同一主题的三条笔记分散在两本笔记本中。地址不用随分类改变。</tspan></text><rect x="45" y="160" width="650" height="250" rx="18" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/><text x="67" y="207.7" fill="#1d4ed8" font-size="27"><tspan x="67" dy="0">N001  ·  A本 p12</tspan></text><text x="67" y="261.3" fill="#334155" font-size="23"><tspan x="67" dy="0">问题：下降百分比相对于谁？</tspan><tspan x="67" dy="34.5">80 → 60：减少20，20/80＝25%。</tspan><tspan x="67" dy="34.5">以这次比较的起点为基准。</tspan><tspan x="67" dy="34.5">新比较见 N002（B本p3）。</tspan></text><rect x="805" y="160" width="650" height="250" rx="18" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/><text x="827" y="207.7" fill="#0f766e" font-size="27"><tspan x="827" dy="0">N002  ·  B本 p3</tspan></text><text x="827" y="261.3" fill="#334155" font-size="23"><tspan x="827" dy="0">60 → 80：增加20，20/60 ≈ 33.3%。</tspan><tspan x="827" dy="34.5">关系：应用N001的基准规则。</tspan><tspan x="827" dy="34.5">方向反转后，起点换了。</tspan><tspan x="827" dy="34.5">→ N001（A本p12）查定义。</tspan></text><polyline points="795,290 705,290" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><text x="703" y="343.9" fill="#0f766e" font-size="19"><tspan x="703" dy="0">按地址</tspan><tspan x="703" dy="28.5">回查</tspan></text><polyline points="300,410 300,480" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><text x="325" y="458.1" fill="#1d4ed8" font-size="21"><tspan x="325" dy="0">同一规则用于连续变化</tspan></text><rect x="45" y="490" width="650" height="300" rx="18" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/><text x="67" y="537.7" fill="#1d4ed8" font-size="27"><tspan x="67" dy="0">N003  ·  A本 p19</tspan></text><text x="67" y="591.3" fill="#334155" font-size="23"><tspan x="67" dy="0">80 → 60 → 45：两次各降25%。</tspan><tspan x="67" dy="34.5">总下降35/80＝43.75%，不是50%。</tspan><tspan x="67" dy="34.5">关系：后一次接前一次结果，</tspan><tspan x="67" dy="34.5">每一步都使用N001的基准规则。</tspan><tspan x="67" dy="34.5">与N002比较：基准变化，情境不同。</tspan></text><rect x="805" y="490" width="650" height="300" rx="18" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.8"/><text x="827" y="537.7" fill="#6d28d9" font-size="27"><tspan x="827" dy="0">M001  ·  A本 p2  /  主题入口</tspan></text><text x="827" y="591.3" fill="#334155" font-size="23"><tspan x="827" dy="0">中心问题：怎样判断连续变化？</tspan><tspan x="827" dy="34.5">1. 找起点 → N001，A本p12</tspan><tspan x="827" dy="34.5">2. 辨方向 → N002，B本p3</tspan><tspan x="827" dy="34.5">3. 跟中间量 → N003，A本p19</tspan><tspan x="827" dy="34.5">待测：先降20%再升20%会怎样？</tspan></text><polyline points="795,620 705,620" fill="none" stroke="#6d28d9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/><text x="703" y="673.9" fill="#6d28d9" font-size="19"><tspan x="703" dy="0">按问题</tspan><tspan x="703" dy="28.5">取用</tspan></text><rect x="45" y="850" width="1410" height="145" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="1.8"/><text x="70" y="895.8" fill="#92400e" font-size="28"><tspan x="70" dy="0">做一次查找检查，而不只检查目录整不整齐</tspan></text><text x="70" y="946.3" fill="#334155" font-size="23"><tspan x="70" dy="0">从 M001 出发找到相关页 → 说出这条关系 → 用它完成一个新问题。</tspan><tspan x="70" dy="34.5">找不到：修地址与入口。找得到但说不清：补理解，而不是继续增加链接。</tspan></text><text x="45" y="1062.9" fill="#64748b" font-size="19"><tspan x="45" dy="0">根据《卡片笔记写作法》第一、三章改编。本名＋页码及N编号为纸本教学示范；无须照搬卢曼的全部编号体系。</tspan></text></g></svg>